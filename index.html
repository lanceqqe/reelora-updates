<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reelora</title>
<meta name="description" content="Reelora — фильмы и сериалы в одном приложении для macOS, Windows и Android TV.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: одна колонка ~720px — шапка-карточка приложения, выбор платформы, лента релизов */
:root {
  --bg: #1c1c1e;
  --panel: #252527;
  --raised: #343438;
  --line: rgba(255,255,255,.08);
  --text: #f3f3f7;
  --muted: #b3b3bb;
  --accent: #71acff;
  --primary: #1463cc;
  --violet: #8b7cf6;
  --soft: rgba(113,172,255,.16);
  --green: #2bbd6e;
  --font: "Manrope", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f4f7; --panel: #ffffff; --raised: #ebebf0; --line: rgba(20,20,40,.09);
    --text: #141418; --muted: #5d5d68; --accent: #1463cc; --primary: #1463cc;
    --violet: #6d5ce8; --soft: rgba(20,99,204,.1); --green: #17914f; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f4f7; --panel: #ffffff; --raised: #ebebf0; --line: rgba(20,20,40,.09);
  --text: #141418; --muted: #5d5d68; --accent: #1463cc; --primary: #1463cc;
  --violet: #6d5ce8; --soft: rgba(20,99,204,.1); --green: #17914f; color-scheme: light;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
  font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-block: 56px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 44px;
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }

/* Шапка */
.app { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; }
.app img { width: 112px; height: 112px; display: block; filter: drop-shadow(0 14px 30px rgba(110,90,240,.35)); }
.app h1 { margin: 0; font-size: 42px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
.tag { margin: 6px 0 0; color: var(--muted); font-size: 17px; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip {
  font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
  background: var(--raised); color: var(--muted);
}
.chip.v { background: var(--soft); color: var(--accent); font-family: var(--mono); font-weight: 500; }

.cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
  background: var(--primary); color: #fff; font-weight: 700; font-size: 16px;
  padding: 14px 22px; border-radius: 14px; border: 0; cursor: pointer;
  transition: transform .15s ease, filter .15s ease;
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(.98); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn small { font-weight: 500; opacity: .75; font-size: 13px; }
.cta .hint { color: var(--muted); font-size: 13px; }

/* Платформы */
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.plats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.plat {
  display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  padding: 18px 8px 14px; border-radius: 16px; background: var(--panel);
  border: 1px solid var(--line); color: var(--text); font: inherit; cursor: pointer;
  transition: border-color .15s ease, background .15s ease;
}
.plat svg { width: 30px; height: 30px; }
.plat b { font-size: 14px; font-weight: 700; }
.plat span { font-size: 12px; color: var(--muted); }
.plat:hover:not(:disabled) { border-color: var(--accent); }
.plat[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); }
.plat:disabled { cursor: default; opacity: .55; }
.plat:disabled span { color: var(--violet); font-weight: 600; }

.detail {
  margin-top: 12px; padding: 18px 20px; border-radius: 16px; background: var(--panel);
  border: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 16px;
  align-items: center; justify-content: space-between;
}
.detail .info { min-width: 0; }
.detail .info b { display: block; font-size: 16px; }
.detail .info span { color: var(--muted); font-size: 13px; }
.detail .btn { padding: 11px 18px; font-size: 15px; }
.detail .dl { display: flex; flex-wrap: wrap; gap: 10px; }
.steps { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
.steps li + li { margin-top: 2px; }

/* Релизы */
.rel { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rel > li { display: grid; grid-template-columns: 110px minmax(0,1fr); gap: 18px; padding: 18px 0; border-top: 1px solid var(--line); }
.rel > li:first-child { border-top: 0; padding-top: 4px; }
.rel .ver { font-family: var(--mono); font-size: 15px; color: var(--text); }
.rel .date { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rel .new { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700; color: var(--green); }
.notes { min-width: 0; }
.notes ul { margin: 0; padding-left: 18px; }
.notes li + li { margin-top: 4px; }
.notes p { margin: 0; }
.files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.files a {
  font-size: 12px; font-weight: 600; text-decoration: none; color: var(--accent);
  padding: 4px 10px; border-radius: 8px; background: var(--soft);
}
.files a:hover { text-decoration: underline; }
.more {
  margin-top: 6px; align-self: flex-start; background: none; border: 1px solid var(--line); color: var(--text);
  font: inherit; font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 12px; cursor: pointer;
}
.more:hover { border-color: var(--accent); }

footer { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 20px; }

@media (max-width: 560px) {
  .wrap { padding-block: 32px 56px; gap: 36px; }
  .app { grid-template-columns: 1fr; justify-items: start; gap: 16px; }
  .app img { width: 84px; height: 84px; }
  .app h1 { font-size: 34px; }
  .plats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .rel > li { grid-template-columns: 1fr; gap: 8px; }
  .cta .btn, .detail .dl, .detail .dl .btn { width: 100%; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

function normalize(raw) {
  if (!Array.isArray(raw)) return [];
  return raw
    .filter(r => r && !r.draft && !r.prerelease)
    .map(r => {
      const assets = {};
      for (const [id, re] of Object.entries(ASSET_RULES)) {
        const a = (r.assets || []).find(x => re.test(x.name));
        if (a) assets[id] = { url: a.browser_download_url, size: a.size || 0, name: a.name };
      }
      return {
        version: String(r.tag_name || '').replace(/^v/, ''),
        date: r.published_at,
        notes: String(r.body || '').replace(/\r/g, '').replace(/^Установщики для macOS.*$/m, '').trim(),
        assets,
      };
    })
    .filter(r => Object.keys(r.assets).length)
    .sort((a, b) => String(b.date).localeCompare(String(a.date)));
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mb = b => b ? (b / 1048576).toFixed(b > 104857600 ? 0 : 1).replace('.', ',') + ' МБ' : '';
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
const withSize = (label, a) => a.size ? `${label} <small>${mb(a.size)}</small>` : label;

function detectOS() {
  const ua = navigator.userAgent;
  const touch = navigator.maxTouchPoints > 1;
  if (/Android/i.test(ua)) return /TV|AFT|BRAVIA|MiBOX|Chromecast/i.test(ua) ? 'tv' : 'android';
  if (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && touch)) return 'ios';
  if (/Windows/i.test(ua)) return 'win';
  if (/Macintosh|Mac OS X/i.test(ua)) return 'mac';
  return null;
}

function notesHTML(text) {
  const lines = String(text || '').split('\n').map(l => l.trim()).filter(Boolean);
  let out = '', list = false;
  for (const l of lines) {
    if (/^[-*]\s+/.test(l)) {
      if (!list) { out += '<ul>'; list = true; }
      out += '<li>' + esc(l.replace(/^[-*]\s+/, '')) + '</li>';
    } else {
      if (list) { out += '</ul>'; list = false; }
      out += '<p>' + esc(l) + '</p>';
    }
  }
  return out + (list ? '</ul>' : '');
}

  const more = document.getElementById('more');
  more.hidden = showAll || RELEASES.length <= SHOWN;
  more.textContent = `Показать все версии (${RELEASES.length})`;
}
document.getElementById('more').addEventListener('click', () => { showAll = true; renderReleases(); });

function renderAll() { renderHeader(); renderCTA(); renderPlatforms(); renderReleases(); }
renderAll();

fetch(`https://api.github.com/repos/${REPO}/releases?per_page=100`, { headers: { Accept: 'application/vnd.github+json' } })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(raw => {
    const fresh = normalize(raw);
    if (!fresh.length) return;
    RELEASES = fresh; latest = fresh[0];
    if (!available(selected)) selected = 'mac';
    renderAll();
  })
  .catch(() => {});
</script>
</body>
</html>
